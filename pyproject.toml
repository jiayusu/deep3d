[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "deep3d-cad"
version = "0.3.0"
description = "Editable mechanical CAD, constrained sketches and durable engineering tasks"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cadquery-ocp-novtk==8.0.1.0.0",
    "slvs==3.3",
]

[project.scripts]
deep3d-cad = "deep3d_cad.cli:main"
deep3d-agent = "deep3d_agent.cli:main"
deep3d-worker = "deep3d_worker.cli:main"
deep3d-run = "deep3d_runtime_client.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "jsonschema==4.25.1", "ruff==0.13.3"]

[tool.hatch.build.targets.wheel]
packages = ["workers/cad/src/deep3d_cad", "runtime/agent/src/deep3d_agent", "runtime/worker/src/deep3d_worker", "runtime/client/src/deep3d_runtime_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
